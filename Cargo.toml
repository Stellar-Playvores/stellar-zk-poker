[workspace]
resolver = "2"
members = [
    "contracts/stellar-zk-poker-table",
    "contracts/stellar-zk-poker-zk-verifier",
    "contracts/stellar-zk-poker-committee-registry",
    "contracts/stellar-zk-poker-game-hub",
    "stellar-zk-poker-cards",
    "services/stellar-zk-poker-coordinator",
    "services/stellar-zk-poker-node",
]

[workspace.dependencies]
soroban-sdk = { git = "https://github.com/stellar/rs-soroban-sdk.git", rev = "acffbbd45be6a0a551146eebfc268d6f95078246" }
stellar-zk-poker-cards = { path = "stellar-zk-poker-cards" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
